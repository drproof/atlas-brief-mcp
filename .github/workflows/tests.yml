name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # Bewusst pip statt uv: eine bewegliche Abhaengigkeit weniger im CI.
        # Die Tests brauchen nur die Projekt-Dependencies plus pytest.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Version
        run: python -c "import sys; print(sys.version)"

      - name: Tests
        # Kein Netzwerk: alle Google-Aufrufe sind in den Tests gefaked.
        run: python -m pytest -q

      - name: Smoke-Test (MCP-Protokoll)
        run: python scripts/smoke_mcp.py --root examples/demo
