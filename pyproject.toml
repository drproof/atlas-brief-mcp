[project]
name = "atlas-brief-mcp"
version = "0.2.0"
description = "Lokaler MCP-Index für Projekt-Dokumentation: Token-sparende Suche, verifizierte Statuszeilen, Anbindungs-Nachweis"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=1.2,<2",
    "pyyaml>=6.0",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Homepage = "https://github.com/<DEIN-USER>/atlas-brief-mcp"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
