# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      atlasRoot:
        type: string
        default: "."
        description: "Root folder of the project whose Markdown documentation should be indexed."
  commandFunction:
    |-
    (config) => ({
      command: 'uvx',
      args: ['--from', 'atlas-brief-mcp', 'atlas', 'serve'],
      env: {
        ATLAS_ROOT: config.atlasRoot || '.'
      }
    })
