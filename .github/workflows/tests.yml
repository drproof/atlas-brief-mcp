name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # Use pip directly in CI for minimal moving parts.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Version
        run: python -c "import sys; print(sys.version)"

      - name: Tests
        # Offline test suite: all Google API calls are faked.
        run: python -m pytest -q

      - name: Smoke-Test (MCP protocol)
        run: python scripts/smoke_mcp.py --root examples/demo
