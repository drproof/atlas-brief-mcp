name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-extras

      - name: Tests
        # Kein Netzwerk: alle Google-Aufrufe sind in den Tests gefaked.
        run: uv run pytest -q

      - name: Smoke-Test (MCP-Protokoll)
        run: uv run python scripts/smoke_mcp.py --root examples/demo
